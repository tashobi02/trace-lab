name: Offline notebook checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create pinned controller
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r environment/notebook_tooling/requirements.lock.txt
          .venv/bin/python -m ipykernel install --prefix .venv --name trace-lab-controller --display-name 'Trace Lab controller'
      - name: Validate and execute offline notebooks
        run: |
          .venv/bin/python - <<'PYCODE'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          root = Path.cwd()
          for path in root.rglob('*.ipynb'):
              if '.venv' in path.parts or 'outputs' in path.parts:
                  continue
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              for cell in notebook.cells:
                  if cell.cell_type != 'code':
                      continue
                  assert isinstance(cell.execution_count, int) and cell.execution_count > 0, path
                  assert cell.outputs, f'Missing saved cell output: {path}'
                  assert not any(output.output_type == 'error' for output in cell.outputs), path
                  assert cell.metadata.get('jupyter', {}).get('outputs_hidden', False) is False, path
                  assert cell.metadata.get('collapsed', False) is False, path
          for name in ['notebooks/getting_started/inspect_workspace.ipynb', 'environment/validate_notebook_environment.ipynb', 'tests/offline/test_workspace_configuration.ipynb', 'tests/offline/test_reward_delivery.ipynb', 'tests/offline/test_attempt_rules.ipynb', 'tests/offline/test_worker_supervision.ipynb']:
              notebook = nbformat.read(root / name, as_version=4)
              NotebookClient(notebook, kernel_name='trace-lab-controller', timeout=300,
                             resources={'metadata': {'path': str(root)}}).execute()
          PYCODE

  scientific-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install CPU fixture dependencies
        run: |
          python -m pip install torch==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.23.1 gymnasium==0.29.1 stable-baselines3==2.2.1 pandas==1.5.3 matplotlib==3.9.4
      - name: Execute scientific fixture notebooks without external assets
        run: |
          python -B - <<'PYCODE'
          from pathlib import Path
          import json
          for name in ['test_window_reset', 'test_observations_and_actions', 'test_monitor_boundary']:
              path=Path('tests/offline')/(name+'.ipynb')
              namespace={'__name__':'__main__'}
              for index,cell in enumerate(json.loads(path.read_text())['cells']):
                  if cell['cell_type']=='code':
                      exec(compile(''.join(cell['source']),str(path)+':'+str(index),'exec'),namespace)
          PYCODE
